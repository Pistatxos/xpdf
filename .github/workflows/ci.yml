name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Librerías del sistema para Qt (pruebas de interfaz sin pantalla)
        run: sudo apt-get update -q && sudo apt-get install -y -q libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync
      - name: Tests
        run: uv run pytest -q
      - name: Tipos (mypy estricto)
        run: uv run mypy
