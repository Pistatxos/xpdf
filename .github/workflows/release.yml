# Publica una versión al subir una etiqueta vX.Y.Z:
#   compila en Windows y macOS, comprueba el ejecutable (--selftest),
#   y crea la versión en GitHub Releases con SHA256SUMS.txt.
# Las copias instaladas de xpdf y los scripts install.ps1/install.sh
# descargan desde aquí.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: La etiqueta coincide con la versión del código
        shell: bash
        run: |
          VERSION=$(uv run --no-project python -c "import sys; sys.path.insert(0, 'src'); import xpdf; print(xpdf.__version__)")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con __version__ = $VERSION"; exit 1
          fi

      - run: uv sync

      - name: Tests
        run: uv run pytest -q

      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Empaquetar y autocomprobar
        run: uv run python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: xpdf-${{ runner.os }}
          path: |
            dist/xpdf-*-windows-x64-setup.exe
            dist/xpdf-*-macos-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Sumas SHA-256
        working-directory: assets
        run: sha256sum xpdf-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publicar en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "xpdf ${GITHUB_REF_NAME#v}" \
            --generate-notes
