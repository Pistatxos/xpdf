[project]
name = "xpdf"
version = "0.1.0"
description = "Editor de PDF de escritorio, minimalista"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.7",
    "PyMuPDF>=1.24",
]

[project.scripts]
xpdf = "xpdf.main:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "pyinstaller>=6.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xpdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:builtin type .* has no __module__:DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/xpdf"]

[[tool.mypy.overrides]]
# PyMuPDF no publica anotaciones completas.
module = "xpdf.core.*"
disallow_untyped_calls = false
